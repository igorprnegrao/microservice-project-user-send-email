server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    import: "optional:file:../ms-email/.env-email[.properties]"
  application:
    name: ms-email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}
broker:
  queue:
    email:
      name: ${RABBITMQ_EMAIL_QUEUE:default.email}
    email-result:
      name: ${RABBITMQ_EMAIL_RESULT_QUEUE:default.email.result}
